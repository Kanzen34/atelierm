[build]
  command = "npm run build-only"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# SPA fallback for vue-router (history mode)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
